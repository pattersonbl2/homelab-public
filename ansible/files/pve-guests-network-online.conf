; Drop-in for pve-guests.service (systemd override, not a package patch).
;
; Upstream pve-guests.service has no ordering dependency on
; networking.service or network-online.target at all — it's only gated by
; basic.target/sysinit.target plus a handful of PVE service units. That
; means guest autostart can (and on 2026-07-16 did) race ahead of bond/
; bridge setup on a slow or unstable boot.
;
; This is defense-in-depth, not the fix: it only tightens the ordering at
; unit *start*. It does nothing for a `systemctl restart networking` run
; later while guests are already up (the actual proximate cause of the
; 2026-07-16 outage) — that failure mode is handled by
; lxc-veth-watchdog.timer instead.
[Unit]
After=network-online.target
Wants=network-online.target
