---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: matchups-board
  namespace: n8n
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
  - host: matchups.bp31app.com
    http:
      paths:
      - path: /webhook/matchups-data
        pathType: Exact
        backend:
          service: {name: n8n, port: {number: 5678}}
      - path: /webhook/matchups-page
        pathType: Exact
        backend:
          service: {name: n8n, port: {number: 5678}}
