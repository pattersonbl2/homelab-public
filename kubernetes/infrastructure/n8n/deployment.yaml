---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: n8n
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app.kubernetes.io/name: n8n}
  template:
    metadata:
      labels: {app.kubernetes.io/name: n8n}
    spec:
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
      initContainers:
      - name: fix-permissions
        image: busybox:1.36
        command: ["sh", "-c", "chown -R 1000:1000 /home/node/.n8n"]
        volumeMounts:
        - name: data
          mountPath: /home/node/.n8n
      containers:
      - name: n8n
        image: n8nio/n8n:2.37.10-5542b8b
        ports:
        - {containerPort: 5678, name: http}
        env:
        - name: DB_TYPE
          value: postgresdb
        - name: DB_POSTGRESDB_HOST
          value: n8n-pg-rw.n8n.svc.cluster.local
        - name: DB_POSTGRESDB_PORT
          value: "5432"
        - name: DB_POSTGRESDB_DATABASE
          value: n8n
        - name: DB_POSTGRESDB_USER
          value: n8n
        - name: DB_POSTGRESDB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: n8n-pg-app
              key: password
        - name: N8N_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: n8n-secrets
              key: N8N_ENCRYPTION_KEY
        - name: GENERIC_TIMEZONE
          value: America/Toronto
        - name: N8N_PROTOCOL
          value: https
        - name: N8N_HOST
          value: n8n.bp31app.com
        - name: WEBHOOK_URL
          value: https://n8n.bp31app.com
        - name: N8N_EMAIL_MODE
          value: smtp
        - name: N8N_SMTP_HOST
          value: smtp.resend.com
        - name: N8N_SMTP_PORT
          value: "465"
        - name: N8N_SMTP_SSL
          value: "true"
        - name: N8N_SMTP_USER
          value: resend
        - name: N8N_SMTP_SENDER
          value: noreply@email.ark31.info
        - name: N8N_SMTP_PASS
          valueFrom:
            secretKeyRef:
              name: n8n-secrets
              key: N8N_SMTP_PASS
        volumeMounts:
        - name: data
          mountPath: /home/node/.n8n
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {cpu: 1000m, memory: 1Gi}
        livenessProbe:
          httpGet: {path: /healthz, port: http}
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet: {path: /healthz, port: http}
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: n8n-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-data
  namespace: n8n
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: n8n
  namespace: n8n
spec:
  selector: {app.kubernetes.io/name: n8n}
  ports:
  - {port: 5678, targetPort: 5678, name: http}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: n8n
  namespace: n8n
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
  # SECURITY 2026-07-09: was n8n.bp31app.com — the UI was public via the tunnel
  # wildcard (contradicting the tunnel's "n8n UI stays internal" comment).
  # Restricted to the LAN name (resolves only on Pi-hole). The public webhook
  # path remains learn-webhook.bp31app.com in terraform-cloudflare.
  - host: n8n.local.bp31app.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service: {name: n8n, port: {number: 5678}}
