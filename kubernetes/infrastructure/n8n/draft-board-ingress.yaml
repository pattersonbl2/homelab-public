---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: draft-board
  namespace: n8n
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
  - host: draft.bp31app.com
    http:
      paths:
      - path: /webhook/draft-board
        pathType: Exact
        backend:
          service: {name: n8n, port: {number: 5678}}
      - path: /webhook/draft-page
        pathType: Exact
        backend:
          service: {name: n8n, port: {number: 5678}}
