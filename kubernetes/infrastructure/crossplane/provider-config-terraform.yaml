---
# Default ProviderConfig for Terraform provider
# Sync wave 2: must wait for Provider CRD to be installed
apiVersion: tf.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: default
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  # No credentials needed - credentials are passed via tfvars
  configuration: |
    terraform {
      backend "kubernetes" {
        secret_suffix    = "tfstate"
        namespace        = "crossplane-system"
        in_cluster_config = true
      }
    }
