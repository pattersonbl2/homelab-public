---
# Default deny all ingress
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: ntfy
spec:
  endpointSelector: {}
  ingress: []
---
# Allow Traefik ingress
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-traefik-ingress
  namespace: ntfy
spec:
  endpointSelector:
    matchLabels:
      app: ntfy
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
---
# Allow monitoring (Prometheus scraping)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-monitoring-scrape
  namespace: ntfy
spec:
  endpointSelector:
    matchLabels:
      app: ntfy
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP

---
# Allow Uptime Kuma to send notifications
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-uptime-kuma-ingress
  namespace: ntfy
spec:
  endpointSelector:
    matchLabels:
      app: ntfy
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: uptime-kuma
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
