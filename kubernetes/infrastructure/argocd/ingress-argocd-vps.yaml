---
# ArgoCD Ingress for VPS tunnel access via Pangolin
# TLS terminated at Pangolin/Traefik on VPS - internal traffic is HTTP
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server-vps
  namespace: argocd
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
  - host: argocd.vps.bp31app.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: argocd-server
            port:
              number: 80
