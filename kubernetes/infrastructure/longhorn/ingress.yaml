---
# Longhorn UI ingress - internal access only via VPS tunnel
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: longhorn-ui-vps
  namespace: longhorn-system
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
  - host: longhorn.vps.bp31app.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: longhorn-frontend
            port:
              number: 80
