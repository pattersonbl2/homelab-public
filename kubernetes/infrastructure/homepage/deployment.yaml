---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: homepage
    spec:
      serviceAccountName: homepage
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:v2.1.2
          ports:
            - containerPort: 3000
          env:
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "home.bp31app.com"
          envFrom:
            - secretRef:
                name: homepage-secrets
          volumeMounts:
            - name: config-services
              mountPath: /app/config/services.yaml
              subPath: services.yaml
            - name: config-settings
              mountPath: /app/config/settings.yaml
              subPath: settings.yaml
            - name: config-widgets
              mountPath: /app/config/widgets.yaml
              subPath: widgets.yaml
            - name: config-kubernetes
              mountPath: /app/config/kubernetes.yaml
              subPath: kubernetes.yaml
            - name: config-docker
              mountPath: /app/config/docker.yaml
              subPath: docker.yaml
            - name: logs
              mountPath: /app/config/logs
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 512Mi
              cpu: 500m
      volumes:
        - name: config-services
          configMap:
            name: homepage-config
            items:
              - key: services.yaml
                path: services.yaml
        - name: config-settings
          configMap:
            name: homepage-config
            items:
              - key: settings.yaml
                path: settings.yaml
        - name: config-widgets
          configMap:
            name: homepage-config
            items:
              - key: widgets.yaml
                path: widgets.yaml
        - name: config-kubernetes
          configMap:
            name: homepage-config
            items:
              - key: kubernetes.yaml
                path: kubernetes.yaml
        - name: config-docker
          configMap:
            name: homepage-config
            items:
              - key: docker.yaml
                path: docker.yaml
        - name: logs
          emptyDir: {}
