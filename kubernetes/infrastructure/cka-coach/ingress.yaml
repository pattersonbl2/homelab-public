apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cka-coach
  namespace: cka-coach
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
  - host: cka.local.bp31app.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cka-coach
            port: {number: 8080}
