---
# Cilium CNI via Helm
# Must deploy before other workloads (sync-wave: -1)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://helm.cilium.io/
    chart: cilium
    targetRevision: 1.15.0
    helm:
      valuesObject:
        operator:
          replicas: 1
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
        bgpControlPlane:
          enabled: true
        ipam:
          mode: kubernetes
          operator:
            clusterPoolIPv4PodCIDR: "10.42.0.0/16"
        bpf:
          masquerade: true
          tproxy: true
        hubble:
          enabled: true
          relay:
            enabled: true
          ui:
            enabled: true
          metrics:
            enabled:
              - dns
              - drop
              - tcp
              - flow
              - icmp
              - http
            # ServiceMonitor is provided by the cilium-ingress app via
            # infrastructure/cilium/hubble-servicemonitor.yaml (with the
            # release: kube-prometheus-stack label needed for scraping).
            # Letting the chart render its own caused two apps to fight
            # over ServiceMonitor/hubble in kube-system.
            serviceMonitor:
              enabled: false
        enableRemoteNodeIdentity: true
        enableWellKnownIdentities: false
        enableServiceMesh: false
        encryption:
          enabled: false
          type: ipsec
        bandwidthManager:
          enabled: true
        bpfMapDynamicSizeRatio: "0.0025"
        enableIPv4Masquerade: true
        enableIPv6Masquerade: false
        enableLocalRedirectPolicy: false
        enableNodePort: true
        enableSRv6: false
        enableXTSocketFallback: true
        installIptablesRules: true
        kubeProxyReplacement: "strict"
        kubeProxyReplacementHealthzAddr: "0.0.0.0:10256"
        k8sServiceHost: "10.10.10.13"
        k8sServicePort: 6443

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  ignoreDifferences:
    - group: apps
      kind: DaemonSet
      name: cilium
      namespace: kube-system
      jqPathExpressions:
        - .spec.template.metadata.annotations
        - .spec.template.spec.containers[].env[].valueFrom.resourceFieldRef.divisor
        - .spec.template.spec.initContainers[].env[].valueFrom.resourceFieldRef.divisor
    - group: apps
      kind: Deployment
      namespace: kube-system
      jqPathExpressions:
        - .spec.template.metadata.annotations
        - .spec.template.spec.containers[].env[].valueFrom.resourceFieldRef.divisor
        - .spec.template.spec.initContainers[].env[].valueFrom.resourceFieldRef.divisor

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
