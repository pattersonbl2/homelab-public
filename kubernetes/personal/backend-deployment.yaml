apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
  namespace: personal
  labels:
    app: backend-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-api
  template:
    metadata:
      labels:
        app: backend-api
    spec:
      containers:
        - name: api
          image: docker.io/pattersonbl2/personal-api:latest
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: backend-secrets
          env:
            - name: RESUME_PDF_PATH
              value: /resume.pdf
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
