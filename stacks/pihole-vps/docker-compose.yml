name: pihole-vps
services:
  pihole:
    image: pihole/pihole:2026.02.0
    container_name: pihole
    restart: unless-stopped
    network_mode: host
    environment:
      - WEBPASSWORD=${PIHOLE_PASSWORD:-changeme}
      - TZ=America/New_York
      - FTLCONF_webserver_port=8081
      - FTLCONF_dns_listeningMode=all
    volumes:
      - pihole-data:/etc/pihole
      - pihole-dnsmasq:/etc/dnsmasq.d
    dns:
      - 1.1.1.1
      - 1.0.0.1
    cap_add:
      - NET_ADMIN

volumes:
  pihole-data:
  pihole-dnsmasq:
