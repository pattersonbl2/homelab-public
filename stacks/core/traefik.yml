api:
  dashboard: true
  insecure: true

entryPoints:
  web:
    address: ":80"
    # Allow HTTP for local domains (HTTP routers will handle these)
    # HTTPS redirect only happens if no HTTP router matches
  websecure:
    address: ":443"

providers:
  docker:
    endpoint: "tcp://docker-socket-proxy:2375"
    exposedByDefault: false
    network: homelab
  file:
    directory: /etc/traefik/dynamic
    watch: true

certificatesResolvers:
  cloudflare:
    acme:
      email: bpatterson@ark31.info
      storage: /certificates/acme.json
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - "1.1.1.1:53"
          - "8.8.8.8:53"
