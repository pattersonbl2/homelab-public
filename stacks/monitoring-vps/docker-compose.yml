---
# VPS monitoring stack
# - node-exporter: VPS host metrics (scraped by Prometheus via vps-metrics.vps.bp31app.com)
# - promtail: ships VPS Docker + syslog to Loki in K8s (via loki-push.vps.bp31app.com)
#
# Both services attach to pangolin so Traefik (gerbil) can reach them.
# Deploy: docker compose up -d
services:
  node-exporter:
    image: prom/node-exporter:v1.10.2
    container_name: node-exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/host/root'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - pangolin
    expose:
      - "9100"

  promtail:
    image: grafana/promtail:3.6.7
    container_name: promtail
    restart: unless-stopped
    volumes:
      - /var/log:/var/log/host:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /run/docker.sock:/run/docker.sock:ro
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - pangolin

networks:
  pangolin:
    external: true
