services:
  ollama:
    image: ollama/ollama:0.30.11
    container_name: ollama
    restart: unless-stopped
    env_file:
      - ../env
    networks:
      - homelab
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_KEEP_ALIVE=10m
      - OLLAMA_NUM_PARALLEL=2
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    env_file:
      - ../env
    depends_on:
      - ollama
    networks:
      - homelab
    volumes:
      - open-webui-data:/app/backend/data
    ports:
      - "8080:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_NAME=Homelab LLM

networks:
  homelab:
    name: homelab
    external: true

volumes:
  ollama-data:
  open-webui-data:
