        certResolver: cloudflare
    homepage:
      rule: "Host(`home.local.bp31app.com`)"
      entryPoints: [websecure]
      service: homepage
      tls:
        certResolver: cloudflare

  services:
    sonarr:
      loadBalancer:
        servers:
          - url: "http://192.168.50.30:8989"
