## DYNAMIC configuration (file provider)
## Domain is written literally — file provider does NOT interpolate env vars.
http:
  routers:
    sonarr:
      rule: "Host(`sonarr.local.bp31app.com`)"
      entryPoints: [websecure]
      service: sonarr
      tls:
        certResolver: cloudflare
    radarr:
      rule: "Host(`radarr.local.bp31app.com`)"
      entryPoints: [websecure]
      service: radarr
      tls:
        certResolver: cloudflare
    prowlarr:
      rule: "Host(`prowlarr.local.bp31app.com`)"
      entryPoints: [websecure]
      service: prowlarr
      tls:
        certResolver: cloudflare
    qbit:
      rule: "Host(`qbit.local.bp31app.com`)"
      entryPoints: [websecure]
      service: qbit
      tls:
        certResolver: cloudflare
    nzbget:
      rule: "Host(`nzbget.local.bp31app.com`)"
      entryPoints: [websecure]
      service: nzbget
      tls:
        certResolver: cloudflare
    requests:
      rule: "Host(`requests.local.bp31app.com`)"
      entryPoints: [websecure]
      service: requests
      tls:
        certResolver: cloudflare
    jellyfin:
      rule: "Host(`jellyfin.local.bp31app.com`)"
      entryPoints: [websecure]
      service: jellyfin
      tls:
        certResolver: cloudflare
    webui:
      rule: "Host(`ai.local.bp31app.com`)"
