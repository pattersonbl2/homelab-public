services:
  flowise:
    image: flowiseai/flowise:3.1.4
    container_name: flowise
    restart: unless-stopped
    env_file:
      - ../env
    environment:
      - PORT=3001
      - FLOWISE_USERNAME=admin
      - FLOWISE_PASSWORD=${FLOWISE_PASSWORD}
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - flowise-data:/root/.flowise
    networks:
      - homelab
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.flowise.rule=Host(`flowise.${DOMAIN}`)"
      - "traefik.http.routers.flowise.entrypoints=websecure"
      - "traefik.http.routers.flowise.tls.certresolver=cloudflare"
      - "traefik.http.routers.flowise-http.rule=Host(`flowise.${DOMAIN}`)"
      - "traefik.http.routers.flowise-http.entrypoints=web"
      - "traefik.http.routers.flowise-http.service=flowise"
      - "traefik.http.services.flowise.loadbalancer.server.port=3001"
      - "homepage.group=AI"
      - "homepage.name=Flowise"
      - "homepage.icon=flowise"
      - "homepage.href=https://flowise.${DOMAIN}"
      - "homepage.description=Visual RAG pipeline builder"

  anythingllm:
    image: mintplexlabs/anythingllm:1.16.1
    container_name: anythingllm
    restart: unless-stopped
    env_file:
      - ../env
    environment:
      - STORAGE_DIR=/app/server/storage
      - JWT_SECRET=${ANYTHINGLLM_JWT_SECRET}
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_PATH=http://ollama:11434
      - OLLAMA_MODEL_PREF=llama3.1:8b
      - EMBEDDING_ENGINE=native
      - VECTOR_DB=lancedb
    volumes:
      - anythingllm-data:/app/server/storage
    cap_add:
      - SYS_ADMIN
    networks:
      - homelab
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.anythingllm.rule=Host(`docs.${DOMAIN}`)"
      - "traefik.http.routers.anythingllm.entrypoints=websecure"
      - "traefik.http.routers.anythingllm.tls.certresolver=cloudflare"
      - "traefik.http.routers.anythingllm-http.rule=Host(`docs.${DOMAIN}`)"
      - "traefik.http.routers.anythingllm-http.entrypoints=web"
      - "traefik.http.routers.anythingllm-http.service=anythingllm"
      - "traefik.http.services.anythingllm.loadbalancer.server.port=3001"
      - "homepage.group=AI"
      - "homepage.name=AnythingLLM"
      - "homepage.icon=anythingllm"
      - "homepage.href=https://docs.${DOMAIN}"
      - "homepage.description=Document Q&A with RAG"

networks:
  homelab:
    name: homelab
    external: true

volumes:
  flowise-data:
  anythingllm-data:
