---
- name: Install Pihole on pihole-lxc
  hosts: pihole-lxc
  become: true
  vars:
    pihole_password: "{{ lookup('env', 'PIHOLE_PASSWORD') | default('changeme', true) }}"

  tasks:
    - name: Install dependencies
      apt:
        name:
          - curl
          - git
          - lighttpd
        state: present
        update_cache: true

    - name: Create pihole config directory
      file:
        path: /etc/pihole
        state: directory
        mode: "0755"

    - name: Write pihole setupVars.conf
      copy:
        dest: /etc/pihole/setupVars.conf
        content: |
          PIHOLE_INTERFACE=eth0
          IPV4_ADDRESS=192.168.50.20/24
          IPV6_ADDRESS=
          PIHOLE_DNS_1=1.1.1.1
          PIHOLE_DNS_2=8.8.8.8
          QUERY_LOGGING=true
          INSTALL_WEB_SERVER=true
          INSTALL_WEB_INTERFACE=true
          LIGHTTPD_ENABLED=true
          BLOCKING_ENABLED=true
        mode: "0644"

    - name: Download and run Pihole installer (unattended)
      shell: |
        curl -sSL https://install.pi-hole.net | bash /dev/stdin --unattended
      args:
        creates: /usr/local/bin/pihole

    - name: Ensure pihole-FTL is running
      systemd:
        name: pihole-FTL
        state: started
        enabled: true

- name: Install Pihole on pihole-lxc-2 (replica)
  hosts: pihole-lxc-2
  become: true
  vars:
    pihole_password: "{{ lookup('env', 'PIHOLE_PASSWORD') | default('changeme', true) }}"

  tasks:
    - name: Install dependencies
      apt:
        name:
          - curl
          - git
          - lighttpd
        state: present
        update_cache: true

    - name: Create pihole config directory
      file:
        path: /etc/pihole
        state: directory
        mode: "0755"

    - name: Write pihole setupVars.conf for replica
      copy:
        dest: /etc/pihole/setupVars.conf
        content: |
          PIHOLE_INTERFACE=eth0
          IPV4_ADDRESS=192.168.50.22/24
          IPV6_ADDRESS=
          PIHOLE_DNS_1=1.1.1.1
          PIHOLE_DNS_2=8.8.8.8
          QUERY_LOGGING=true
          INSTALL_WEB_SERVER=true
          INSTALL_WEB_INTERFACE=true
          LIGHTTPD_ENABLED=true
          BLOCKING_ENABLED=true
        mode: "0644"

    - name: Download and run Pihole installer (unattended)
      shell: |
        curl -sSL https://install.pi-hole.net | bash /dev/stdin --unattended
      args:
        creates: /usr/local/bin/pihole

    - name: Ensure pihole-FTL is running
      systemd:
        name: pihole-FTL
        state: started
        enabled: true

    - name: Install Gravity Sync prerequisites
      apt:
        name:
          - curl
          - rsync
          - sqlite3
        state: present

    - name: Check if Gravity Sync already installed
      stat:
        path: /usr/local/bin/gravity-sync
      register: gravity_sync_binary

    - name: Download and install Gravity Sync
      shell: |
        curl -sSL https://raw.githubusercontent.com/vmstan/gs-install/main/gs-install.sh | bash
      when: not gravity_sync_binary.stat.exists

    - name: Generate SSH key for Gravity Sync on replica
      command: ssh-keygen -t ed25519 -f /root/.ssh/id_gravity -N "" -C "gravity-sync@pihole-lxc-2"
      args:
        creates: /root/.ssh/id_gravity
      register: gravity_key_created

    - name: Read replica Gravity Sync public key
      slurp:
        src: /root/.ssh/id_gravity.pub
      register: gravity_pubkey

    - name: Authorize replica key on primary pihole
      authorized_key:
        user: root
        key: "{{ gravity_pubkey['content'] | b64decode }}"
      delegate_to: pihole-lxc

    - name: Create Gravity Sync config directory
      file:
        path: /etc/gravity-sync
        state: directory
        mode: "0755"

    - name: Write Gravity Sync config on replica
      copy:
        dest: /etc/gravity-sync/gravity-sync.conf
        content: |
          REMOTE_HOST='192.168.50.20'
          REMOTE_USER='root'
          REMOTE_SSH_PKIF='/root/.ssh/id_gravity'
          PIHOLE_DIR='/etc/pihole'
          GRAVITY_FI='gravity.db'
          CUSTOM_DNS='custom.list'
        mode: "0644"

    - name: Add Gravity Sync pull cron on replica
      cron:
        name: gravity-sync-pull
        minute: "*/30"
        job: "/usr/local/bin/gravity-sync pull >> /var/log/gravity-sync.log 2>&1"
        user: root
