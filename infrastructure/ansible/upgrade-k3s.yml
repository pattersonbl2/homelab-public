---
# K3s cluster upgrade playbook
# Upgrades control planes first, then drains/upgrades/uncordons workers one at a time.
#
# Usage:
#   ansible-playbook -i k3s-inventory.ini upgrade-k3s.yml \
#     -e k3s_version=v1.30.14+k3s2
#
# The install script re-uses existing config from /etc/rancher/k3s/
# so no extra flags are needed for agent nodes.

- name: Upgrade K3s control plane nodes
  hosts: k3s_cp
  serial: 1              # one CP at a time
  become: true
  gather_facts: false

  vars:
    k3s_version: "v1.30.14+k3s2"

  tasks:
    - name: Show current K3s version
      command: k3s --version
      register: current_version
      changed_when: false

    - name: Print current version
      debug:
        msg: "{{ inventory_hostname }}: {{ current_version.stdout_lines[0] }}"

    - name: Upgrade K3s server
      shell: |
        curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION="{{ k3s_version }}" sh -
      args:
        executable: /bin/bash
      timeout: 300

    - name: Wait for node to be Ready
      shell: sudo kubectl get node {{ inventory_hostname }} --no-headers 2>/dev/null | awk '{print $2}'
      register: node_ready
      until: node_ready.stdout == "Ready"
      retries: 30
      delay: 10

    - name: Show new K3s version
      command: k3s --version
      register: new_version
      changed_when: false

    - name: Print new version
      debug:
        msg: "{{ inventory_hostname }}: upgraded to {{ new_version.stdout_lines[0] }}"


- name: Upgrade K3s worker nodes
  hosts: k3s_worker
  serial: 1              # one worker at a time
  become: true
  gather_facts: false

  vars:
    k3s_version: "v1.30.14+k3s2"

  tasks:
    - name: Show current K3s version
      command: k3s --version
      register: current_version
      changed_when: false

    - name: Print current version
      debug:
        msg: "{{ inventory_hostname }}: {{ current_version.stdout_lines[0] }}"

    - name: Drain node
      command: sudo kubectl drain {{ inventory_hostname }} --ignore-daemonsets --delete-local-data --force --timeout=120s
      delegate_to: k3s-cp-1
      vars:
        ansible_user: bp31
        ansible_ssh_private_key_file: ~/.ssh/id_ed25519_homelab

    - name: Upgrade K3s agent
      shell: |
        curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION="{{ k3s_version }}" sh -
      args:
        executable: /bin/bash
      timeout: 300

    - name: Wait for node to be Ready
      shell: sudo kubectl get node {{ inventory_hostname }} --no-headers 2>/dev/null | awk '{print $2}'
      register: node_ready
      until: node_ready.stdout == "Ready"
      retries: 30
      delay: 10
      delegate_to: k3s-cp-1
      vars:
        ansible_user: bp31
        ansible_ssh_private_key_file: ~/.ssh/id_ed25519_homelab

    - name: Uncordon node
      command: sudo kubectl uncordon {{ inventory_hostname }}
      delegate_to: k3s-cp-1
      vars:
        ansible_user: bp31
        ansible_ssh_private_key_file: ~/.ssh/id_ed25519_homelab

    - name: Show new K3s version
      command: k3s --version
      register: new_version
      changed_when: false

    - name: Print new version
      debug:
        msg: "{{ inventory_hostname }}: upgraded to {{ new_version.stdout_lines[0] }}"
