# Wazuh agent deployment targets
# Separate from inventory.ini (which is Terraform-generated and gitignored)
# Usage: ansible-playbook -i wazuh-hosts.ini deploy-wazuh-agents.yml

[wazuh_agents]
homelab-1 ansible_host=192.168.50.97 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_ed25519_homelab ansible_ssh_common_args='-F /dev/null -o IdentitiesOnly=yes -o StrictHostKeyChecking=no'
proxmox ansible_host=192.168.50.176 ansible_user=root ansible_ssh_private_key_file=~/.ssh/id_ed25519_homelab ansible_ssh_common_args='-F /dev/null -o IdentitiesOnly=yes -o StrictHostKeyChecking=no'
proxmox2 ansible_host=192.168.50.26 ansible_user=root ansible_ssh_private_key_file=~/.ssh/id_ed25519_homelab ansible_ssh_common_args='-F /dev/null -o IdentitiesOnly=yes -o StrictHostKeyChecking=no'
vps ansible_host=REDACTED_VPS_IP ansible_user=root ansible_ssh_private_key_file=~/.ssh/id_ed25519_homelab ansible_ssh_common_args='-F /dev/null -o IdentitiesOnly=yes -o StrictHostKeyChecking=no'

# K3s nodes (proxied through VyOS gateway)
